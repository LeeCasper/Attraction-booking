name: attraction-booking-dev

services:
  mysql:
    image: mysql:8.0
    container_name: ab-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: attraction_booking
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ab_mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123456"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ab_redis_data:/data
    command: --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ab_mysql_data:
  ab_redis_data:
