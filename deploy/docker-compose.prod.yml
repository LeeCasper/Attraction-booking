# =============================================================================
# 生产编排：MySQL + Redis + API（Debian 主机，nginx 跑在**宿主机**上）
#
# 用法（在 deploy/ 目录下，先 `cp .env.production.example .env` 并改里面的值）：
#   docker compose -f docker-compose.prod.yml up -d --build     # 起服务
#   docker compose -f docker-compose.prod.yml logs -f api       # 看日志
#   docker compose -f docker-compose.prod.yml run --rm tools npm run seed   # 首次初始化数据
#   docker compose -f docker-compose.prod.yml run --rm tools npm run smoke  # 冒烟
#
# ⚠️ 为什么 nginx 不在这个文件里：这台机器上**宿主机 nginx 已经在跑**（ai.artaides.com
#    的站点 + Let's Encrypt 证书），再起一个容器 nginx 会抢 80/443，把那个站点一起搞挂。
#    所以入口交给宿主机 nginx（vhost 见 `deploy/nginx/res.artaides.com.conf`），
#    容器只负责应用与数据，API 只发布到 `127.0.0.1`（外网碰不到，必须过 nginx）。
#
# 数据与文件都在**卷/绑定目录**里，`docker compose down` 不会丢；只有显式 `down -v` 才会。
# =============================================================================
name: attraction-prod

services:
  mysql:
    image: mysql:8.0
    container_name: ab-prod-mysql
    restart: unless-stopped
    # 字符集与时区必须与 `deploy/sql/init.sql` / 服务端 `BUSINESS_TZ` 一致：
    # `--default-time-zone=+08:00` 少了它，`CURDATE()` 与业务日期在凌晨会差一天（约束 11）
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?deploy/.env 里必须给 DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-attraction_booking}
      TZ: ${BUSINESS_TZ:-Asia/Shanghai}
    volumes:
      - ab_prod_mysql:/var/lib/mysql
      # 只在数据卷为空（首次）时执行；之后改表要手动 ALTER，见 CLAUDE.md「表结构权威来源」
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
    # 故意**不发布端口**：只有 compose 网络里的 api 能连它

  redis:
    image: redis:7-alpine
    container_name: ab-prod-redis
    restart: unless-stopped
    command: --appendonly yes
    volumes:
      - ab_prod_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../server
      target: runtime
    container_name: ab-prod-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器里连的是服务名，不是 127.0.0.1；这两个**覆盖** .env 里的本机地址
      DB_HOST: mysql
      REDIS_HOST: redis
      UPLOAD_DIR: /app/uploads
      NODE_ENV: production
    # 只绑本机：外网必须走 nginx（HTTPS + 证书 + 上传直出都在那边）
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      # 上传的图**必须落在宿主机目录**：一是重部署不丢，二是 nginx 要直接读它
      - ${UPLOADS_DIR:-/srv/attraction/uploads}:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 一次性任务（seed / 冒烟 / 回填）：**默认不启动**，要用的显式 run。
  # 用 builder 层是因为 seed 走 ts-node，而 tsc 只编 src/，dist 里没有它。
  tools:
    profiles: ["tools"]
    build:
      context: ../server
      target: builder
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      UPLOAD_DIR: /app/uploads
    volumes:
      - ${UPLOADS_DIR:-/srv/attraction/uploads}:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  ab_prod_mysql:
  ab_prod_redis:
