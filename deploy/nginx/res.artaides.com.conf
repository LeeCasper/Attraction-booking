# =============================================================================
# res.artaides.com —— 小程序端 API 的入口（**宿主机 nginx**，不是容器）
#
# 装法（Debian / Ubuntu，与 ai.artaides.com 那套并存，互不影响）：
#   sudo cp res.artaides.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/res.artaides.com.conf /etc/nginx/sites-enabled/
#   # 先只放 80 的 ACME 段（下面注释里那份），签完证书再启用 443：
#   sudo certbot --nginx -d res.artaides.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ 证书要**给 res 单独签一张**：这台机器上现成的那张是 ai.artaides.com 的，
#    拿它来服务 res 会让浏览器/微信报证书不匹配（微信直接拒绝请求）。
#
# 为什么上传目录由 nginx 直出、不走 Node：
#   ① 重部署/重启 API 时图片照常可访问；② 绕开应用进程，省内存也快
#   （应用侧的上传接口本身有 5MB 限制，那是**写**的路径，与这里无关）
# =============================================================================

# 上传目录 —— 与 docker-compose.prod.yml 里 api 服务的绑定目录**必须是同一个**
# （compose 里是 ${UPLOADS_DIR:-/srv/attraction/uploads}，默认值就写在这）
# 若你改过 UPLOADS_DIR，这里的三处 alias/root 也要跟着改。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name res.artaides.com;

    # certbot 续期校验必须能过（放在跳转之前）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name res.artaides.com;

    # certbot 签完会写在这里（`certbot --nginx` 也会自动把这段加上）
    ssl_certificate     /etc/letsencrypt/live/res.artaides.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/res.artaides.com/privkey.pem;

    # 小程序上传图片（后台）走这里；应用侧限制 5MB，这里留点余量
    client_max_body_size 8m;

    access_log /var/log/nginx/res.artaides.com.access.log;
    error_log  /var/log/nginx/res.artaides.com.error.log;

    # —— 上传的图：nginx 直接读文件，不进 Node ——
    # 应用里这条路由是 `GET /api/uploads/:name`（见 server/src/modules/admin/upload.controller.ts），
    # 所以对外路径就是 /api/uploads/xxx.jpg，与客户端 `mediaUrl()` 拼出来的一致。
    location /api/uploads/ {
        alias /srv/attraction/uploads/;
        # 文件名是服务端生成的十六进制名，不会变 → 长缓存
        expires 30d;
        add_header Cache-Control "public, immutable";
        # 不存在就 404（不要 fallback 到 index，那会返回一坨 HTML 让 <image> 静默失败）
        try_files $uri =404;
        access_log off;
    }

    # —— 小程序端 API ——
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 微信支付回调要按**原文**验签，别在 nginx 这层动 body
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }

    # —— 微信支付回调 ——
    # ⚠️ 路径**不在 /api 下**：main.ts 的 setGlobalPrefix 把 pay/wx/* 排除了，
    #    微信那边配的也是 https://res.artaides.com/pay/wx/notify
    location /pay/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # —— Swagger（可选）——
    # 只用来联调对接口用；不想对外暴露就整段删掉（或加 allow/deny 只放自己的 IP）
    location /docs {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 这个子域只提供 API：其他路径一律 404，别把默认站点或别的服务漏出去
    location / {
        return 404;
    }
}
